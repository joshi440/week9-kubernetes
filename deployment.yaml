
apiVersion: apps/v1
kind: Deployment

metadata:
  name: registration-deployment

spec:
  replicas: 1

  selector:
    matchLabels:
      app: registration-app

  template:
    metadata:
      labels:
        app: registration-app

    spec:
      containers:
        - name: registration-app
          image: joshitha2404/registration-app:v1
          ports:
            - containerPort: 5000
